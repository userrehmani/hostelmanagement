<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#059669">
  <link rel="manifest" href="manifest.json">
  <title>Warden Operations Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div id="wardenLoginGate" class="max-w-md mx-auto mt-16 bg-slate-900 border border-emerald-500/30 rounded-2xl p-8 shadow-2xl space-y-5">
    <div class="text-center">
      <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-2xl mx-auto mb-3"><i class="fa-solid fa-user-shield"></i></div>
      <h1 class="text-xl font-bold">Private Warden Portal</h1>
      <p class="text-xs text-slate-400">Sirf authorized staff ke liye</p>
    </div>
    <form onsubmit="handleWardenLogin(event)" class="space-y-4 text-sm">
      <input id="wEmail" type="email" required placeholder="Warden Email" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
      <input id="wPass" type="password" required placeholder="Password" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl">Login</button>
    </form>
  </div>

  <div id="wardenApp" style="display:none" class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <header class="bg-slate-900 border border-emerald-500/30 rounded-2xl p-4 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-white">👮 Warden Operations Console</h1>
        <p class="text-xs text-emerald-400">Gate, leaves, complaints, electricity, visitors</p>
      </div>
      <div class="flex gap-2">
        <button onclick="installHostelPWA()" class="pwa-install-trigger bg-emerald-600/20 text-emerald-300 px-3 py-1.5 rounded-lg text-xs">Install App</button>
        <button onclick="staffLogout()" class="bg-slate-800 hover:bg-rose-600 px-3 py-1.5 rounded-lg text-xs">Logout</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-base font-bold text-emerald-400">Leave Approvals & Gate In/Out</h2>
        <div id="wardenLeavesList" class="space-y-2 text-xs"></div>
        <hr class="border-slate-800">
        <div id="wardenGateList" class="space-y-2 text-xs"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-base font-bold text-amber-400">Complaints</h2>
        <div id="wardenComplaintsList" class="space-y-2 text-xs"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-base font-bold text-indigo-400">Room Electricity Split</h2>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
          <select id="wRoomSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-white"></select>
          <input id="wPrev" type="number" min="0" placeholder="Prev Units" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-white">
          <input id="wCurr" type="number" min="0" placeholder="Curr Units" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-white">
          <input id="wRate" type="number" min="0" placeholder="Rate/Unit" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-white">
          <button onclick="applyMeter()" class="bg-emerald-600 text-white font-bold rounded-lg px-3 py-2">Split Bill</button>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-base font-bold text-purple-400">Visitor Logbook</h2>
        <form onsubmit="addVisitor(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
          <input id="vName" required maxlength="80" placeholder="Visitor Name" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white">
          <input id="vStu" required maxlength="80" placeholder="Meeting Student" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-white">
          <button type="submit" class="bg-purple-600 text-white font-bold rounded-lg px-3 py-2">+ Log Visitor</button>
        </form>
        <div id="wardenVisitorsList" class="space-y-2 text-xs max-h-72 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    async function handleWardenLogin(e) {
      e.preventDefault();
      try {
        await staffLogin($("wEmail").value, $("wPass").value);
      } catch (err) {
        alert(err.message === "NOT_STAFF"
          ? "❌ Ye account warden ke liye authorized nahi hai."
          : "❌ Login fail: email ya password ghalat hai.");
      }
    }

    function renderWardenConsole() {
      const ready = isStaffReady();
      $("wardenApp").style.display = ready ? "block" : "none";
      if (!ready) return;
      const db = getDB();

      $("wardenLeavesList").innerHTML = db.leaves.length ? db.leaves.map(l => `
        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <span><strong>${esc(l.studentName)} (${esc(l.room)}):</strong> ${esc(l.reason)} (${esc(l.from)} → ${esc(l.to)})</span>
          ${l.status === "Pending"
            ? `<button onclick="approveLeave('${esc(l.id)}')" class="bg-emerald-600 text-white px-3 py-1 rounded font-bold">Approve</button>`
            : `<span class="text-emerald-400 font-bold">${esc(l.status)}</span>`}
        </div>`).join("") : `<p class="text-slate-500">Koi leave request nahi.</p>`;

      $("wardenGateList").innerHTML = db.students.filter(s => s.status === "Active").map(s => `
        <div class="p-2.5 bg-slate-950 rounded-lg border border-slate-800 flex justify-between items-center">
          <span><strong>${esc(s.name)}</strong> (${esc(s.id)} - ${esc(s.room)})</span>
          <button onclick="toggleGate('${esc(s.id)}')" class="px-2.5 py-1 rounded font-bold ${s.gateStatus === "Inside" ? "bg-emerald-500/20 text-emerald-300" : "bg-amber-500/20 text-amber-300"}">${esc(s.gateStatus || "Inside")}</button>
        </div>`).join("") || `<p class="text-slate-500">Koi active student nahi.</p>`;

      $("wardenComplaintsList").innerHTML = db.complaints.length ? db.complaints.map(c => `
        <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <span><strong>${esc(c.studentName || "")} (Room ${esc(c.room)}):</strong> ${esc(c.issue)}</span>
          ${c.status !== "Resolved"
            ? `<button onclick="resolveComplaint('${esc(c.id)}')" class="bg-emerald-600 text-white px-3 py-1 rounded font-bold">Resolve</button>`
            : `<span class="text-emerald-400 font-bold">Resolved</span>`}
        </div>`).join("") : `<p class="text-slate-500">Koi complaint nahi.</p>`;

      const roomSel = $("wRoomSelect");
      const prevRoom = roomSel.value;
      roomSel.innerHTML = db.rooms.map(r => `<option value="${esc(r.no)}">${esc(r.no)}</option>`).join("");
      if (prevRoom) roomSel.value = prevRoom;

      $("wardenVisitorsList").innerHTML = db.visitors.map(v => `
        <div class="p-2 bg-slate-950 rounded border border-slate-800 flex justify-between">
          <span><strong>${esc(v.visitorName)}</strong> → ${esc(v.studentName)}</span>
          <span class="text-emerald-400">${esc(v.timeIn)}</span>
        </div>`).join("");
    }

    function approveLeave(id) {
      const db = getDB();
      const lv = db.leaves.find(l => l.id === id);
      if (!lv) return;
      lv.status = "Approved";
      saveDB(db, `Warden ne leave approve ki: ${lv.studentName}`, "Warden");
    }

    function toggleGate(id) {
      const db = getDB();
      const s = db.students.find(st => st.id === id);
      if (!s) return;
      s.gateStatus = s.gateStatus === "Inside" ? "Out of Hostel" : "Inside";
      saveDB(db, `Warden ne ${s.name} ka gate status ${s.gateStatus} kiya`, "Warden");
    }

    function resolveComplaint(id) {
      const db = getDB();
      const c = db.complaints.find(x => x.id === id);
      if (!c) return;
      c.status = "Resolved";
      saveDB(db, `Complaint resolve ki (Room ${c.room})`, "Warden");
    }

    function applyMeter() {
      const db = getDB();
      const roomId = $("wRoomSelect").value;
      const units = Math.max(0, num($("wCurr").value) - num($("wPrev").value));
      const bill = units * num($("wRate").value);
      const occupants = db.students.filter(s => String(s.room) === roomId && s.status === "Active");
      if (!occupants.length) return alert("⚠️ Is room mein koi student nahi hai.");
      const share = Math.round(bill / occupants.length);
      occupants.forEach(s => { s.elec = share; });
      saveDB(db, `Room ${roomId} ki electricity split: Rs. ${share} per student`, "Warden");
      alert(`✅ Rs. ${share} har student ko lag gaya (${occupants.length} students).`);
    }

    function addVisitor(e) {
      e.preventDefault();
      const db = getDB();
      db.visitors.unshift({
        id: "VIS-" + Date.now(),
        visitorName: $("vName").value.trim(),
        studentName: $("vStu").value.trim(),
        timeIn: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      });
      saveDB(db, `Visitor log hua: ${$("vName").value.trim()}`, "Warden");
      e.target.reset();
    }
  </script>
</body>
</html>
