<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelCloud — Founder HQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
    <form onsubmit="founderLogin(event)" class="bg-slate-900 border border-indigo-500/40 rounded-2xl max-w-md w-full p-8 space-y-4">
      <h1 class="text-xl font-extrabold text-white text-center">Founder HQ Login</h1>
      <input id="fEmail" type="email" required placeholder="Founder Email" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
      <input id="fPass" type="password" required placeholder="Password" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white">
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl">Unlock</button>
    </form>
  </div>

  <div id="appView" style="display:none" class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <header class="flex flex-col sm:flex-row justify-between gap-4 bg-slate-900 border border-indigo-500/30 rounded-2xl p-6">
      <div>
        <h1 class="text-xl font-extrabold">HostelCloud <span class="text-indigo-400">Founder HQ</span></h1>
        <p class="text-xs text-slate-400">Licenses, provisioning, suspension</p>
      </div>
      <div class="flex gap-3 text-xs">
        <div class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl text-center"><span class="text-slate-400 block text-[10px]">Hostels</span><strong id="kpiTenants" class="text-lg">0</strong></div>
        <div class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl text-center"><span class="text-slate-400 block text-[10px]">Active</span><strong id="kpiActive" class="text-lg text-emerald-400">0</strong></div>
        <div class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl text-center"><span class="text-slate-400 block text-[10px]">MRR</span><strong id="kpiMrr" class="text-lg text-amber-400">Rs. 0</strong></div>
      </div>
    </header>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
      <h2 class="text-base font-bold">Register / License Hostel</h2>
      <form onsubmit="provisionHostel(event)" class="grid grid-cols-1 sm:grid-cols-5 gap-3 text-xs">
        <input id="tSlug" required pattern="[a-zA-Z0-9_-]+" placeholder="slug (e.g. almadina)" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 font-mono">
        <input id="tName" required placeholder="Hostel Name" class="sm:col-span-2 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5">
        <input id="tPhone" required placeholder="Owner Phone" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5">
        <input id="tFee" required type="number" min="0" value="2500" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5">
        <button type="submit" class="sm:col-span-5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl">Save License</button>
      </form>
      <p class="text-[11px] text-slate-500">Admin/warden login: Firebase Console mein user banayein, phir <code>hostel_staff/{uid}</code> doc mein <code>{ "tenant": "slug", "role": "admin" }</code> likhein.</p>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
      <h2 class="text-base font-bold">Registered Hostels</h2>
      <div id="tenantsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
  </div>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyCRXCp75adfyFUbyZHlgRGQtu2vqb-TPMM",
      authDomain: "hostel-cloud-pk.firebaseapp.com",
      projectId: "hostel-cloud-pk",
      storageBucket: "hostel-cloud-pk.firebasestorage.app",
      messagingSenderId: "394742737685",
      appId: "1:394742737685:web:a8faef1ab5bf69d84e971c"
    });
    const auth = firebase.auth();
    const fs = firebase.firestore();
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let licenses = {}, publics = {}, listening = false;

    async function founderLogin(e) {
      e.preventDefault();
      try { await auth.signInWithEmailAndPassword($("fEmail").value.trim(), $("fPass").value); }
      catch (err) { alert("❌ Login fail hua."); }
    }

    auth.onAuthStateChanged(async user => {
      if (!user || user.isAnonymous) { $("loginView").style.display = "flex"; $("appView").style.display = "none"; return; }
      const snap = await fs.collection("hostel_staff").doc(user.uid).get();
      if (!snap.exists || snap.data().role !== "founder") {
        await auth.signOut();
        return alert("❌ Ye account founder nahi hai.");
      }
      $("loginView").style.display = "none";
      $("appView").style.display = "block";
      if (!listening) startListeners();
    });

    function startListeners() {
      listening = true;
      fs.collection("hostel_license").onSnapshot(snap => {
        licenses = {};
        snap.forEach(d => licenses[d.id] = d.data());
        render();
      });
      fs.collection("hostel_public").onSnapshot(snap => {
        publics = {};
        snap.forEach(d => publics[d.id] = d.data());
        render();
      });
    }

    function render() {
      const grid = $("tenantsGrid");
      let active = 0, mrr = 0;
      const base = location.origin + location.pathname.replace(/master\.html$/, "");

      grid.innerHTML = Object.keys(licenses).map(id => {
        const lic = licenses[id];
        const pub = publics[id] || {};
        const suspended = lic.isSuspended === true;
        const fee = Number(lic.saasFee) || 0;
        const occ = Object.values(pub.occupancy || {}).reduce((a, b) => a + b, 0);
        if (!suspended) { active++; mrr += fee; }

        const links = {
          Public: `${base}index.html?hostel=${id}`,
          Student: `${base}student.html?hostel=${id}`,
          Admin: `${base}admin.html?hostel=${id}`,
          Warden: `${base}warden.html?hostel=${id}`
        };
        return `
          <div class="bg-slate-950 border ${suspended ? "border-rose-500/40" : "border-slate-800"} rounded-2xl p-5 space-y-3 text-xs">
            <div class="flex justify-between items-start">
              <div>
                <span class="font-mono text-indigo-400 font-bold">?hostel=${esc(id)}</span>
                <h3 class="text-base font-bold text-white">${esc(lic.hostelName || id)}</h3>
                <p class="text-slate-400">Phone: ${esc(lic.ownerPhone || "—")} | Plan: <strong class="text-emerald-400">Rs. ${fee.toLocaleString()}/mo</strong></p>
              </div>
              <span class="px-2.5 py-1 rounded-full font-bold text-[11px] ${suspended ? "bg-rose-500/20 text-rose-300" : "bg-emerald-500/20 text-emerald-300"}">${suspended ? "SUSPENDED" : "ACTIVE"}</span>
            </div>
            <div class="grid grid-cols-3 gap-2 bg-slate-900 p-3 rounded-xl text-center">
              <div><span class="text-slate-400 block text-[10px]">Rooms</span><strong>${(pub.rooms || []).length}</strong></div>
              <div><span class="text-slate-400 block text-[10px]">Students</span><strong class="text-indigo-400">${occ}</strong></div>
              <div><span class="text-slate-400 block text-[10px]">Status</span><strong>${suspended ? "Locked" : "Live"}</strong></div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              ${Object.entries(links).map(([k, href]) => `<a href="${esc(href)}" target="_blank" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-center py-2 rounded-lg font-semibold">${k} ↗</a>`).join("")}
            </div>
            <div class="flex justify-end pt-2 border-t border-slate-800">
              <button onclick="toggleSuspend('${esc(id)}', ${suspended})" class="${suspended ? "bg-emerald-600" : "bg-rose-600"} text-white px-3 py-1.5 rounded-lg font-bold">
                ${suspended ? "Unlock Hostel" : "Suspend Lock"}
              </button>
            </div>
          </div>`;
      }).join("") || `<p class="text-slate-500 text-sm">Abhi koi hostel registered nahi hai.</p>`;

      $("kpiTenants").innerText = Object.keys(licenses).length;
      $("kpiActive").innerText = active;
      $("kpiMrr").innerText = `Rs. ${mrr.toLocaleString()}`;
    }

    function provisionHostel(e) {
      e.preventDefault();
      const slug = $("tSlug").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
      if (!slug) return alert("❌ Slug ghalat hai.");
      fs.collection("hostel_license").doc(slug).set({
        hostelName: $("tName").value.trim(),
        ownerPhone: $("tPhone").value.trim(),
        saasFee: Number($("tFee").value) || 0,
        isSuspended: false,
        updatedAt: new Date().toISOString()
      }, { merge: true })
        .then(() => { alert(`✅ ${slug} license save ho gaya.`); e.target.reset(); })
        .catch(err => alert("❌ Save fail: " + err.message));
    }

    function toggleSuspend(id, current) {
      fs.collection("hostel_license").doc(id).update({ isSuspended: !current })
        .catch(err => alert("❌ Update fail: " + err.message));
    }
  </script>
</body>
</html>
